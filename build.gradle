plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'org.jetbrains.kotlin.jvm' version '2.4.21'
    id 'maven-publish'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }

// Mojang ships Java 25 with 26.3
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
kotlin { jvmToolchain(25) }

repositories {
    mavenCentral()
    // Jade (the WAILA of 26.x), compile-only: EA's tooltip plugin loads only when Jade is installed
    exclusiveContent {
        forRepository { maven { url = "https://api.modrinth.com/maven" } }
        filter { includeGroup "maven.modrinth" }
    }
}

// datagen output (P5) is part of the mod's resources
sourceSets.main.resources { srcDir 'src/generated/resources' }
// The checked model library (cad/, board #44) is compiled into the mod, as Stasis does with towergen; :cad compiles
// it alone, without Minecraft.
sourceSets.main.java.srcDir 'cad/src/main/java'
// The API for other mods (docs/api.md) is compiled on its own, against Minecraft and NeoForge alone, so it can't name
// EA's internals: mods.eln.api, .lowlevel and .spi in src/api, the testkit in src/apiTestkit (on the API alone). Both
// are part of the mod (its jar, runs and tests) and are packaged as eln-api and eln-api-testkit jars for other mods to
// compile against (see "The eln-api jars" below).
sourceSets {
    api
    apiTestkit {
        compileClasspath += api.output
    }
}
dependencies {
    implementation sourceSets.api.output
    implementation sourceSets.apiTestkit.output
}
// The device models made with it (src/cadmodels: mods.eln.cad.models.Catalog) are generated at build time into
// build/generated/cad (OBJ, MTL, atlases, origins, hitboxes, the converters' block models and sprites), not committed.
// The task fails the build if a model breaks the checker; it is cached on the library's and the models' code.
sourceSets {
    cadmodels {
        java { srcDir 'src/cadmodels/java' }
    }
}
dependencies {
    cadmodelsImplementation project(':cad')
}
def generateCadModels = tasks.register('generateCadModels', JavaExec) {
    description = 'Writes the checked device models (mods.eln.cad.models.Catalog) into build/generated/cad'
    classpath = sourceSets.cadmodels.runtimeClasspath
    mainClass = 'mods.eln.cad.models.Catalog'
    def out = layout.buildDirectory.dir('generated/cad')
    args out.get().asFile.absolutePath
    inputs.files(sourceSets.cadmodels.runtimeClasspath).withNormalizer(ClasspathNormalizer)
    outputs.dir(out)
    outputs.cacheIf { true }
    doFirst { delete out }
}
sourceSets.main.resources.srcDir(generateCadModels)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // Runs every registered game test headless, then exits (exit code = failed required tests).
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'eln.golden', file('golden/1.12').absolutePath
            // the cable benchmark instead of the tests: -PelnBench=result.json [-PelnBenchLabel=name]
            if (project.hasProperty('elnBench')) {
                systemProperty 'eln.bench', file(project.property('elnBench')).absolutePath
                systemProperty 'eln.bench.label', project.findProperty('elnBenchLabel') ?: 'unnamed'
                if (project.hasProperty('elnBenchConvert')) systemProperty 'eln.bench.convert', 'true'
                if (project.hasProperty('elnBenchNoRthCache')) systemProperty 'eln.bench.noRthCache', 'true'
            }
        }
        // Datagen (P5): lang, item tags, recipes -> src/generated/resources (committed)
        clientData {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.api)
            sourceSet(sourceSets.apiTestkit)
        }
    }

    addModdingDependenciesTo(sourceSets.api)
    addModdingDependenciesTo(sourceSets.apiTestkit)

    // The game on the unit-test classpath (the sim's NBT uses CompoundTag); JUnit 5 platform, JUnit 4 tests via vintage
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

dependencies {
    // Kotlin: shipped inside the mod jar (jarJar), so the pack doesn't need Kotlin for Forge
    // (KFF 6.3.0 supports Minecraft up to 26.2 only). Several mods jarJar'ing it is fine: NeoForge loads the newest.
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${kotlin_version}"
    jarJar("org.jetbrains.kotlin:kotlin-stdlib:[${kotlin_version},)") { version { prefer kotlin_version } }
    // The MNA solver's QR decomposition
    implementation "org.apache.commons:commons-math3:${commons_math_version}"
    jarJar("org.apache.commons:commons-math3:[${commons_math_version},)") { version { prefer commons_math_version } }

    compileOnly "maven.modrinth:jade:26.3.5+neoforge"
    // JEI (the pack's version), compile-only: EA's plugin shows the cable-kit recipes, which JEI can't list itself
    compileOnly "maven.modrinth:jei:31.12.0.65"
    // Curios (the pack's version): the battery belt's belt slot. Optional at runtime.
    compileOnly "maven.modrinth:curios:17.0.0-beta.3+26.3"
    // GuideME (the pack's version, also AE2's): the Electrical Engineer's Ledger is a GuideME guide. Optional at runtime.
    compileOnly "org.appliedenergistics:guideme:${guideme_version}:api"
    runtimeOnly "org.appliedenergistics:guideme:${guideme_version}"

    testImplementation 'junit:junit:4.13.2'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // property-based tests (random circuits, thermal networks); runs on the JUnit platform next to Jupiter/vintage
    testImplementation 'net.jqwik:jqwik:1.9.3'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // Utils.rand returns the midpoint (the 1.12 sim tests were written against that)
    systemProperty 'eln.deterministic', 'true'
    // jqwik keeps failing seeds (replayed first on the next run) under build/, not in the tests' working directory
    systemProperty 'jqwik.database', file('build/jqwik-database').absolutePath
    if (project.hasProperty('fluidCases')) systemProperty 'fluid.cases', project.property('fluidCases')
    // the checked model library's reports and before/after previews (board #44): -PcadReport=PREFIX -PcadPreviews=DIR
    if (project.hasProperty('cadReport')) systemProperty 'cad.report', project.property('cadReport')
    if (project.hasProperty('cadDetail')) systemProperty 'cad.detail', project.property('cadDetail')
    if (project.hasProperty('cadPreviews')) systemProperty 'cad.previews', project.property('cadPreviews')
    systemProperty 'eln.resources', file('src/main/resources').absolutePath
    // machine API golden traces (BenchTest): -PapiTraces rewrites src/test/resources/mods/eln/api/*.trace instead of comparing
    if (project.hasProperty('apiTraces')) systemProperty 'eln.api.traces', file('src/test/resources/mods/eln/api').absolutePath
    // LayoutTest checks every shipped screen layout (assets/eln/gui)
    systemProperty 'eln.guiDir', file('src/main/resources/assets/eln/gui').absolutePath
}

// The commit this jar is built from (git describe; "-dirty" with uncommitted changes). Baked into the jar
// (eln-build.properties): the network channel's version, so a client whose jar was built from another commit is refused at login instead
// of joining with mismatched block states (Baughn, 2026-10-25: a pack ahead of the server shifted every state id).
def buildCommit = providers.exec {
    commandLine 'git', 'describe', '--always', '--dirty', '--abbrev=12', '--exclude=*'
    ignoreExitValue = true
}.standardOutput.asText.map { it.trim() }.getOrElse('')
if (!buildCommit) buildCommit = 'unknown'

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            build_commit           : buildCommit,
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '10000']
}

// The bike's entity texture, painted from BikeShape (board #44); BikeTextureTest checks the committed PNG matches.
tasks.register('bikeTexture', JavaExec) {
    description = 'Paints textures/entity/electric_bike.png from BikeShape'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'mods.eln.bike.BikeTexture'
    args file('src/main/resources/assets/eln/textures/entity/electric_bike.png').absolutePath
}

// ---- The eln-api jars: the API for other mods, to compile against (compileOnly; EA's own jar is the implementation)
// build/libs/eln-api-<version>.jar (mods.eln.api, .lowlevel, .spi) and eln-api-testkit-<version>.jar (mods.eln.api.testkit,
// for tests), each with its sources and javadoc jars; publishAllPublicationsToBuildRepoRepository puts them in
// build/repo as mods.eln:eln-api and mods.eln:eln-api-testkit. Their manifests carry ElnApi.API_VERSION.
def apiVersionMatch = file('src/api/java/mods/eln/api/ElnApi.java').text =~ /String API_VERSION = "(\d+\.\d+\.\d+)";/
if (!apiVersionMatch.find()) throw new GradleException('ElnApi.java has no API_VERSION = "major.minor.patch"')
def apiVersion = apiVersionMatch.group(1)
apiVersionMatch = null

tasks.named('jar') {
    from sourceSets.api.output
    from sourceSets.apiTestkit.output
}

def apiJars = [api: 'eln-api', apiTestkit: 'eln-api-testkit'].collectEntries { setName, artifact ->
    def set = sourceSets[setName]
    def javadoc = tasks.register("${setName}Javadoc", Javadoc) {
        description = "The ${artifact} javadoc"
        source = set.allJava
        classpath = set.compileClasspath
        destinationDir = layout.buildDirectory.dir("docs/${artifact}").get().asFile
        title = "Electrical Age API ${apiVersion}" + (setName == 'api' ? '' : ': testkit')
        options.encoding = 'UTF-8'
        options.addStringOption('Xdoclint:none', '-quiet')
    }
    def manifestAttributes = [
        'Specification-Title'   : artifact,
        'Specification-Vendor'  : 'Electrical Age',
        'Specification-Version' : apiVersion,
        'Implementation-Title'  : artifact,
        'Implementation-Version': project.version,
        'Eln-Api-Version'       : apiVersion,
        'Minecraft-Version'     : minecraft_version,
    ]
    def jars = [
        jar    : tasks.register("${setName}Jar", Jar) {
            description = "build/libs/${artifact}-<version>.jar: the API classes alone, to compile against"
            archiveBaseName = artifact
            from set.output
            manifest.attributes(manifestAttributes)
        },
        sources: tasks.register("${setName}SourcesJar", Jar) {
            archiveBaseName = artifact
            archiveClassifier = 'sources'
            from set.allSource
            manifest.attributes(manifestAttributes)
        },
        javadoc: tasks.register("${setName}JavadocJar", Jar) {
            archiveBaseName = artifact
            archiveClassifier = 'javadoc'
            from javadoc
            manifest.attributes(manifestAttributes)
        },
    ]
    tasks.named('assemble') { dependsOn jars.values() }
    [(setName): jars]
}

// The leak check: another mod's code compiled against the eln-api jars and Minecraft/NeoForge alone, none of EA's
// other classes (no source path either): the docs' samples (but HeaterElement, EA's own element) and the hidden API
// test machine, then the samples' JUnit tests against the testkit jar too. A public API signature that named an EA
// internal would not compile here (nor in the api source set itself); ApiJarTest checks the jars' classes and manifests.
configurations {
    apiConsumerJunit
}
dependencies {
    apiConsumerJunit platform('org.junit:junit-bom:5.13.4')
    apiConsumerJunit 'org.junit.jupiter:junit-jupiter-api'
}
def compileApiConsumer = tasks.register('compileApiConsumer', JavaCompile) {
    description = 'Compiles the API samples as another mod would: against the eln-api jar and Minecraft/NeoForge only'
    javaCompiler = javaToolchains.compilerFor(java.toolchain)
    source = fileTree('src/test/java/mods/eln/api/docs') { include '*.java'; exclude '*Test.java', 'HeaterElement.java' } +
        fileTree('src/main/java/mods/eln/apitest') { include '*.java' }
    classpath = sourceSets.api.compileClasspath + files(apiJars.api.jar)
    destinationDirectory = layout.buildDirectory.dir('apiConsumer/main')
    options.encoding = 'UTF-8'
}
def compileApiConsumerTest = tasks.register('compileApiConsumerTest', JavaCompile) {
    description = "Compiles the API samples' tests as another mod would: against the eln-api and eln-api-testkit jars"
    javaCompiler = javaToolchains.compilerFor(java.toolchain)
    source = fileTree('src/test/java/mods/eln/api/docs') { include '*Test.java'; exclude 'ApiDocSamplesTest.java' }
    classpath = sourceSets.api.compileClasspath + files(apiJars.api.jar, apiJars.apiTestkit.jar) +
        files(compileApiConsumer) + configurations.apiConsumerJunit
    destinationDirectory = layout.buildDirectory.dir('apiConsumer/test')
    options.encoding = 'UTF-8'
}
tasks.named('check') { dependsOn compileApiConsumer, compileApiConsumerTest }
tasks.named('test') {
    dependsOn apiJars.api.jar, apiJars.apiTestkit.jar
    systemProperty 'eln.apiJar', apiJars.api.jar.get().archiveFile.get().asFile.absolutePath
    systemProperty 'eln.apiTestkitJar', apiJars.apiTestkit.jar.get().archiveFile.get().asFile.absolutePath
}

publishing {
    publications {
        [api: 'eln-api', apiTestkit: 'eln-api-testkit'].each { setName, artifactName ->
            create(setName, MavenPublication) {
                groupId = project.group
                artifactId = artifactName
                version = project.version
                artifact apiJars[setName].jar
                artifact apiJars[setName].sources
                artifact apiJars[setName].javadoc
                if (setName == 'apiTestkit') pom.withXml {
                    def dep = asNode().appendNode('dependencies').appendNode('dependency')
                    dep.appendNode('groupId', project.group)
                    dep.appendNode('artifactId', 'eln-api')
                    dep.appendNode('version', project.version)
                }
            }
        }
    }
    repositories {
        maven {
            name = 'buildRepo'
            url = layout.buildDirectory.dir('repo')
        }
    }
}
