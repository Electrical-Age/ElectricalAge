plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'org.jetbrains.kotlin.jvm' version '2.4.21'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }

// Mojang ships Java 25 with 26.3
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
kotlin { jvmToolchain(25) }

repositories {
    mavenCentral()
    // Jade (the WAILA of 26.x), compile-only: EA's tooltip plugin loads only when Jade is installed
    exclusiveContent {
        forRepository { maven { url = "https://api.modrinth.com/maven" } }
        filter { includeGroup "maven.modrinth" }
    }
}

// datagen output (P5) is part of the mod's resources
sourceSets.main.resources { srcDir 'src/generated/resources' }

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // Runs every registered game test headless, then exits (exit code = failed required tests).
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'eln.golden', file('golden/1.12').absolutePath
            // the cable benchmark instead of the tests: -PelnBench=result.json [-PelnBenchLabel=name]
            if (project.hasProperty('elnBench')) {
                systemProperty 'eln.bench', file(project.property('elnBench')).absolutePath
                systemProperty 'eln.bench.label', project.findProperty('elnBenchLabel') ?: 'unnamed'
                if (project.hasProperty('elnBenchConvert')) systemProperty 'eln.bench.convert', 'true'
                if (project.hasProperty('elnBenchNoRthCache')) systemProperty 'eln.bench.noRthCache', 'true'
            }
        }
        // Datagen (P5): lang, item tags, recipes -> src/generated/resources (committed)
        clientData {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // The game on the unit-test classpath (the sim's NBT uses CompoundTag); JUnit 5 platform, JUnit 4 tests via vintage
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

dependencies {
    // Kotlin: shipped inside the mod jar (jarJar), so the pack doesn't need Kotlin for Forge
    // (KFF 6.3.0 supports Minecraft up to 26.2 only). Several mods jarJar'ing it is fine: NeoForge loads the newest.
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${kotlin_version}"
    jarJar("org.jetbrains.kotlin:kotlin-stdlib:[${kotlin_version},)") { version { prefer kotlin_version } }
    // The MNA solver's QR decomposition
    implementation "org.apache.commons:commons-math3:${commons_math_version}"
    jarJar("org.apache.commons:commons-math3:[${commons_math_version},)") { version { prefer commons_math_version } }

    compileOnly "maven.modrinth:jade:26.3.5+neoforge"
    // JEI (the pack's version), compile-only: EA's plugin shows the cable-kit recipes, which JEI can't list itself
    compileOnly "maven.modrinth:jei:31.12.0.65"

    testImplementation 'junit:junit:4.13.2'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // property-based tests (random circuits, thermal networks); runs on the JUnit platform next to Jupiter/vintage
    testImplementation 'net.jqwik:jqwik:1.9.3'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // Utils.rand returns the midpoint (the 1.12 sim tests were written against that)
    systemProperty 'eln.deterministic', 'true'
    // jqwik keeps failing seeds (replayed first on the next run) under build/, not in the tests' working directory
    systemProperty 'jqwik.database', file('build/jqwik-database').absolutePath
    if (project.hasProperty('fluidCases')) systemProperty 'fluid.cases', project.property('fluidCases')
    // LayoutTest checks every shipped screen layout (assets/eln/gui)
    systemProperty 'eln.guiDir', file('src/main/resources/assets/eln/gui').absolutePath
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '10000']
}
